name: Publish npm package

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
      - scripts/release.mjs
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Skip versions already on npm
        id: release
        run: node scripts/release.mjs status

      - name: Check npm
        if: steps.release.outputs.publish == 'true'
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Install pnpm
        if: steps.release.outputs.publish == 'true'
        run: npm install -g pnpm@11.18.0

      - name: Install build dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the npm library and CLI
        if: steps.release.outputs.publish == 'true'
        run: npm run build:package

      - name: Publish using npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: node scripts/release.mjs publish
